name: Feature Request
description: Suggest an idea or enhancement for GHOST-WATCH C2
title: "[FEAT]: "
labels: ["enhancement"]
body:
  - type: markdown
    attributes:
      value: |
        Thank you for suggesting a feature or improvement for the GHOST-WATCH C2 terminal!
  - type: textarea
    id: problem
    attributes:
      label: Is your feature request related to a problem or audit requirement?
      description: A clear and concise description of what problem or missing SATCOM tool you are trying to solve.
      placeholder: "I'm always frustrated when..."
    validations:
      required: true
  - type: textarea
    id: solution
    attributes:
      label: Describe the solution you'd like
      description: A clear and concise description of what you want to happen.
    validations:
      required: true
  - type: textarea
    id: alternatives
    attributes:
      label: Describe alternatives you've considered
      description: Any alternative solutions or workarounds you've thought of.
    validations:
      required: false
  - type: textarea
    id: context
    attributes:
      label: Additional context or references
      description: Add any mockups, RFC references, hardware specs (e.g. PlutoSDR, HackRF, LimeSDR), or satellite protocol standards.
    validations:
      required: false
