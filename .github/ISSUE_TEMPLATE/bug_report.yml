name: Bug Report
description: Create a report to help us improve GHOST-WATCH C2
title: "[BUG]: "
labels: ["bug", "triage"]
body:
  - type: markdown
    attributes:
      value: |
        Thanks for taking the time to report an issue! Please provide as much detail as possible.
  - type: dropdown
    id: subsystem
    attributes:
      label: Subsystem / Area
      description: Which part of GHOST-WATCH C2 is affected?
      options:
        - "Web Console / React Frontend"
        - "Spectrogram / Waterfall SDR Simulation"
        - "Cognitive Shield / Gemini AI Integration"
        - "Post-Quantum Cryptography Simulation"
        - "Python Diagnostic Toolkit (ghostwatch_tools)"
        - "Server / Express Backend"
        - "CI/CD & Packaging"
        - "Other"
    validations:
      required: true
  - type: textarea
    id: description
    attributes:
      label: Describe the bug
      description: A clear and concise description of what the bug is.
      placeholder: Enter details about the bug...
    validations:
      required: true
  - type: textarea
    id: steps
    attributes:
      label: Steps to Reproduce
      description: Steps to reproduce the behavior.
      placeholder: |
        1. Go to '...'
        2. Click on '....'
        3. Scroll down to '....'
        4. See error
    validations:
      required: true
  - type: textarea
    id: expected
    attributes:
      label: Expected Behavior
      description: A clear and concise description of what you expected to happen.
    validations:
      required: true
  - type: textarea
    id: environment
    attributes:
      label: Environment & Runtime Details
      description: OS, Node version, Python version, Browser, etc.
      placeholder: |
        - OS: [e.g. Ubuntu 22.04 / macOS Sonoma / Windows 11 WSL2]
        - Node Version: [e.g. 20.x]
        - Python Version: [e.g. 3.10.x]
        - Browser: [e.g. Chrome 128, Firefox 130]
    validations:
      required: false
